<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8FD3E8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pit Stop Challenge - Concept demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&family=Cairo:wght@600;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&family=Cairo:wght@600;800;900&display=swap">

<style>
/* =====================================================================
   TOKENS  (overwritten from CONFIG at startup)
   brand = primary, deep = badge/outline ink, cream = panels, hi = glow
   ===================================================================== */
:root{
  --accent:#0A8559; --accent2:#5EE0B0; --accent-d:#06583B;
  --accent-rgb:10 133 89; --accent2-rgb:94 224 176;
  --deep:#032519; --deep-rgb:3 37 25;
  --cream:#FFF6E5; --cream-rgb:255 246 229;
  --amber:#FFB020;
  --ink:var(--deep);
  --ink2:rgb(var(--deep-rgb) / .8);
  --mute:rgb(var(--deep-rgb) / .68);
  --line:rgb(var(--deep-rgb) / .22);
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --inout:cubic-bezier(.65,0,.35,1);
  --in:cubic-bezier(.55,0,.9,.4);
  --f-display:"Bricolage Grotesque","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-text:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-num:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
}
html[lang=ar]{
  --f-display:"Cairo","Bricolage Grotesque","Segoe UI",Tahoma,sans-serif;
  --f-text:"Cairo","Manrope","Segoe UI",Tahoma,system-ui,sans-serif;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;overscroll-behavior:none;background:#BFE6F0;color:var(--deep);
  font:600 17px/1.4 var(--f-text);touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{position:fixed;inset:0;font-variant-numeric:tabular-nums lining-nums}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation;font-family:inherit}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
svg{-webkit-user-drag:none}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:8px;box-shadow:0 0 0 6px var(--cream)}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;box-shadow:none}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums lining-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] *{letter-spacing:0 !important}
.noanim,.noanim *{transition:none !important}

/* sticker-style outlined display type */
.outlined{color:var(--cream);--o:4px;text-shadow:
  calc(var(--o) * -1) calc(var(--o) * -1) 0 var(--deep),0 calc(var(--o) * -1) 0 var(--deep),var(--o) calc(var(--o) * -1) 0 var(--deep),
  calc(var(--o) * -1) 0 0 var(--deep),var(--o) 0 0 var(--deep),
  calc(var(--o) * -1) var(--o) 0 var(--deep),0 var(--o) 0 var(--deep),var(--o) var(--o) 0 var(--deep),
  0 calc(var(--o) * 2.3) 0 var(--deep)}

/* =====================================================================
   SCENE  (original illustration, static)
   ===================================================================== */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#8FD3E8 0%,#C9ECF1 36%,#FFF1D3 68%,#F3D9AB 100%)}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:min(60vh,55vw);display:block}
#app{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column}

/* =====================================================================
   TOP BAR
   ===================================================================== */
#top{position:relative;z-index:30;flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px)}
#brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:6px;min-width:0}
.wordmark{display:flex;align-items:center;gap:10px;min-height:38px}
.wm{font:800 clamp(22px,3.4vmin,34px)/1 var(--f-display);color:var(--deep);white-space:nowrap}
.logo-slot{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;overflow:hidden}
.logo-slot:empty{border:2px dashed rgb(var(--deep-rgb) / .55);background:rgb(var(--cream-rgb) / .55)}
.logo-slot:empty::after{content:attr(data-label);font:700 10px/1 var(--f-text);color:var(--ink2);text-align:center}
.logo-slot svg{width:100%;height:100%;display:block}
.concept{font:700 12px/1 var(--f-text);padding:6px 11px;border-radius:99px;background:var(--deep);color:var(--cream)}
#ctrl{display:flex;align-items:center;gap:2px;flex:none}
.icon-btn{min-width:56px;height:56px;display:grid;place-items:center;border:0;background:none;color:var(--deep);transition:opacity .2s,visibility 0s}
.icon-btn .ring{min-width:44px;height:44px;padding:0 10px;border-radius:22px;display:grid;place-items:center;border:2.5px solid var(--deep);
  background:var(--cream);box-shadow:0 3px 0 var(--deep);transition:transform .38s var(--spring)}
.icon-btn.pressed .ring{transform:translateY(3px) scale(.94);transition-duration:.07s}
.icon-btn svg{width:22px;height:22px;display:block}
.icon-btn b{font:800 15px/1 var(--f-text)}
#btnMute .i-off{display:none}
#btnMute[aria-pressed=true] .i-on{display:none}
#btnMute[aria-pressed=true] .i-off{display:block}
body[data-screen=game] #btnLang{opacity:0;visibility:hidden;pointer-events:none}

/* =====================================================================
   SCREENS
   ===================================================================== */
#screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(16px);
  transition:opacity .14s linear,transform .35s var(--out),visibility 0s .14s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .25s var(--out) .14s,transform .4s var(--out) .14s,visibility 0s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.screen.active .st{animation:rise .5s var(--out) backwards;animation-delay:calc(var(--i,0) * 70ms + 90ms)}

/* ---------- badges (hand-cut chunky HUD shapes) ---------- */
.badge{position:relative;color:var(--cream);padding:10px 18px 12px}
.badge>.bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
.badge>.bg path{fill:var(--deep);stroke:var(--accent);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.badge>:not(.bg){position:relative;z-index:1}
.b-label{display:block;font:700 13px/1 var(--f-text);color:rgb(var(--cream-rgb) / .85);margin-bottom:5px}

/* ---------- buttons: face + slab, press moves the face only ---------- */
.cta{position:relative;display:block;border:0;border-radius:38px;padding:0 0 8px;background:var(--deep);min-width:min(78vw,380px);color:#fff}
.cta .face{display:grid;place-items:center;min-height:66px;padding:0 40px;border-radius:36px;border:3px solid var(--deep);
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent-d) 100%);
  box-shadow:inset 0 3px 0 rgb(255 255 255 / .32);
  font:800 clamp(28px,6vmin,42px)/1 var(--f-display);text-shadow:0 2px 0 rgb(var(--deep-rgb) / .45);transition:transform .4s var(--spring)}
.cta.pressed .face{transform:translateY(6px);transition-duration:.06s}
.cta.idle::before{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid var(--deep);opacity:0;pointer-events:none;animation:invite 2.6s var(--out) infinite}
@keyframes invite{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.12,1.34);opacity:0}}
.cta.sm{min-width:0}
.cta.sm .face{min-height:54px;padding:0 24px;font-size:24px}
.ghost{min-height:56px;padding:0 24px;border-radius:28px;border:2.5px solid var(--deep);background:var(--cream);color:var(--deep);box-shadow:0 4px 0 var(--deep);
  font:800 17px/1 var(--f-text);transition:transform .4s var(--spring)}
.ghost.pressed,.btn.pressed{transform:translateY(4px);transition-duration:.06s}
.btn{min-height:56px;border-radius:16px;border:2.5px solid var(--deep);background:#fff;font:800 17px/1.2 var(--f-text);padding:0 18px;color:var(--deep);box-shadow:0 4px 0 var(--deep);transition:transform .4s var(--spring)}
.btn.warn{background:#FFE3DE;color:#8A1C12}

/* ---------- cards + leaderboard ---------- */
.card{border-radius:26px;border:3px solid var(--deep);background:var(--cream);color:var(--deep);box-shadow:0 8px 0 var(--deep);padding:20px}
.card h2,.card h3{font:800 24px/1.15 var(--f-display)}
.sub{color:var(--ink2);font-size:15px;margin-top:4px;font-weight:600}
.board{list-style:none;display:flex;flex-direction:column;gap:5px}
.board li{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:12px;background:rgb(var(--deep-rgb) / .07)}
.board .rk{width:26px;flex:none;font-size:21px;color:var(--accent-d);text-align:center}
.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:8px}
.board .tm{font-size:21px;white-space:nowrap}
.board .tm small{font:700 12px/1 var(--f-text);margin-inline-start:3px;color:var(--ink2)}
.board li.me{background:rgb(var(--accent-rgb) / .22);box-shadow:inset 0 0 0 2.5px var(--deep)}
.board .you{font:800 12px/1 var(--f-text);padding:4px 9px;border-radius:99px;background:var(--deep);color:var(--cream);flex:none}
.board li.empty{color:var(--ink2);justify-content:center;text-align:center;min-height:56px;font-size:15px}

/* =====================================================================
   START SCREEN
   ===================================================================== */
#sStart{padding:8px calc(var(--sr) + 20px) calc(var(--sb) + 18px) calc(var(--sl) + 20px);gap:12px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.hero{flex:1 1 34%;min-height:190px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero-wrap{flex:1;min-height:0;width:100%;container-type:size;display:grid;place-items:center}
.hero-stage{position:relative;height:min(30vh,110vw);height:min(100cqh,144.44cqw);aspect-ratio:360/520;border-radius:30px;overflow:hidden;isolation:isolate;
  border:4px solid var(--cream);box-shadow:0 0 0 4px var(--deep),0 10px 0 4px var(--deep);
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E"),radial-gradient(120% 90% at 50% 30%,#404845,#232927 72%)}
.hero-car{position:absolute;inset:0;animation:float 4.4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-6px)}}
.copy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.title{font:800 clamp(54px,14vmin,132px)/1.02 var(--f-display);--o:5px;padding-bottom:10px}
html[lang=ar] .title{line-height:1.2}
.title span{display:block;transform:rotate(-2.5deg)}
html[dir=rtl] .title span{transform:none}
.event{display:inline-block;padding:7px 18px;border-radius:99px;background:var(--deep);color:var(--cream);font:700 clamp(14px,2.3vmin,20px)/1.2 var(--f-text)}
.prize{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:18px;border:3px solid var(--deep);background:var(--cream);color:var(--deep);box-shadow:0 5px 0 var(--deep);
  font:800 clamp(15px,2.3vmin,20px)/1.25 var(--f-text)}
.prize svg{width:22px;height:22px;flex:none}
.top5{padding:14px 14px 14px;flex:none}
.top5 h2{font-size:20px;margin-bottom:8px}

/* timing-light gantry (shared by start hero and the launch phase) */
.gantry{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,16px);padding:10px 16px;border-radius:20px;
  background:linear-gradient(#0a0f0d,#050807);border:1px solid var(--line);box-shadow:0 12px 30px rgb(0 0 0 / .55),inset 0 1px 0 rgb(255 255 255 / .06)}
.lamp{position:relative;flex:none;width:clamp(34px,9vmin,62px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c200c,#120c04 72%);box-shadow:inset 0 2px 6px #000}
.lamp::before,.lamp::after{content:"";position:absolute;border-radius:50%;opacity:0;transition:opacity .09s linear}
.lamp::before{inset:-8px;background:radial-gradient(circle,rgb(255 176 32 / .85) 0,rgb(255 176 32 / .3) 48%,transparent 72%)}
.lamp::after{inset:0;background:radial-gradient(circle at 50% 38%,#fff2c9 0,#ffc94d 32%,#ff9a00 78%)}
.lamp.on::before{opacity:.9}
.lamp.on::after{opacity:1}
.gantry.instant .lamp::before,.gantry.instant .lamp::after{transition:none}

.gantry{border:3px solid var(--cream);background:linear-gradient(#10201A,#050C09);box-shadow:0 0 0 3px var(--deep),0 9px 0 3px var(--deep)}

/* =====================================================================
   GAME SCREEN
   ===================================================================== */
#sGame{padding:0 calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px);gap:12px}
#hud{flex:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 2px 0}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.b-timer{min-width:clamp(150px,42vw,300px)}
#timer{display:flex;align-items:baseline;justify-content:flex-start;gap:6px;min-width:6.2ch;font:800 clamp(42px,11vmin,100px)/1 var(--f-num);color:var(--cream);contain:layout paint}
#timer small{font:800 .36em/1 var(--f-num);color:rgb(var(--cream-rgb) / .8)}
#timer.final{animation:finalPop .55s var(--spring)}
@keyframes finalPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.pips{display:flex;gap:6px}
.pip{position:relative;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;border:2.5px solid rgb(var(--cream-rgb) / .6);color:var(--cream);
  font:800 14px/1 var(--f-num);transition:transform .35s var(--spring),background .2s,border-color .2s}
.pip svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);opacity:0;transform:scale(.4);transition:opacity .15s,transform .35s var(--spring)}
.pip[data-s=now]{transform:scale(1.16);border-color:var(--accent2);background:var(--accent)}
.pip[data-s=done]{background:var(--accent);border-color:var(--accent2)}
.pip[data-s=done] b{opacity:0}
.pip[data-s=done] svg{opacity:1;transform:none}
.b-pen{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;opacity:0;transform:scale(.8);transition:opacity .2s,transform .35s var(--spring)}
.b-pen.on{opacity:1;transform:none}
.b-pen .b-label{margin:0}
.b-pen .num{font-size:19px;color:var(--cream)}

#stageWrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
#stage{position:relative;height:min(52vh,128vw);height:min(100cqh,144.44cqw);aspect-ratio:360/520;border-radius:30px;overflow:hidden;isolation:isolate;container-type:inline-size;
  border:4px solid var(--cream);box-shadow:0 0 0 4px var(--deep),0 10px 0 4px var(--deep);
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E"),radial-gradient(120% 90% at 50% 30%,#404845,#232927 72%)}
#camera,#carWrap{position:absolute;inset:0}
.pitbox,.car-body{position:absolute;inset:0;width:100%;height:100%;display:block}
.pitbox rect{stroke:rgb(var(--cream-rgb) / .5) !important;stroke-width:3 !important;stroke-dasharray:14 11 !important}
.wheel{position:absolute;width:27.78%;height:19.23%;padding:0;border:0;border-radius:50%;background:none;display:block;color:inherit}
.wheel svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
div.wheel{pointer-events:none}

/* wheel internals */
.wheel svg *{transform-box:fill-box;transform-origin:center}
.tyre-o{fill:#1a211f;stroke:#2d3834;stroke-width:3}
.scuff{stroke:rgb(255 255 255 / .17);stroke-width:3;stroke-linecap:round;fill:none}
.rim-o{fill:url(#gRimO)}
.sp-o{stroke:#27302d;stroke-width:5;stroke-linecap:round;fill:none}
.tyre-n{fill:#0a0e0d;stroke:#34423d;stroke-width:3;transition:stroke .25s}
.tread{stroke:#1e2825;stroke-width:6;fill:none}
.sw-arc{stroke:var(--accent2);stroke-width:3.5;stroke-linecap:round;fill:none}
.rim-n{fill:url(#gRimN)}
.sp-n{stroke:#2a3531;stroke-width:5;stroke-linecap:round;fill:none}
.nut{fill:#d3dcd8;stroke:#5a6761;stroke-width:1.5;stroke-linejoin:round}
.nut-c{fill:#2a3430}
.nut-glow{fill:url(#gGlow);opacity:0}
.w-ring{fill:none;stroke:var(--accent2);stroke-width:3;opacity:0}
.w-old{transition:transform .28s var(--in),opacity .24s linear}
.w-new{opacity:0;transform:scale(.45) rotate(-260deg);transition:transform .5s var(--spring) .07s,opacity .18s linear .07s}
.w-nut{opacity:.5;transition:transform .28s var(--spring),opacity .2s}
.w-check{opacity:0;transform:scale(.3);transition:transform .4s var(--spring),opacity .15s}
.w-check circle{fill:var(--accent);stroke:var(--accent2);stroke-width:2.5}
.w-check path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.wheel.active .w-ring{opacity:.95;animation:ring 1.05s var(--out) infinite}
.wheel.active .tyre-o,.wheel.active .tyre-n{stroke:var(--accent2)}
@keyframes ring{0%{transform:scale(.9);opacity:.95}100%{transform:scale(1.13);opacity:0}}
.wheel[data-s=loosen] .w-nut{opacity:1}
.wheel[data-s=tighten] .w-nut{opacity:1;transform:rotate(-80deg) scale(1.2)}
.wheel[data-s=done] .w-nut{opacity:.9}
.wheel[data-s=loosen] .nut-glow,.wheel[data-s=tighten] .nut-glow{opacity:1;animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.35);opacity:.5}}
.wheel[data-s=tighten] .w-old,.wheel[data-s=done] .w-old{opacity:0;transform:translateX(var(--out)) scale(1.18) rotate(30deg)}
.wheel[data-s=tighten] .w-new,.wheel[data-s=done] .w-new{opacity:1;transform:none}
.wheel[data-s=done] .tyre-n{stroke:var(--accent2)}
.wheel[data-s=done] .w-check{opacity:1;transform:none}
.ripple{position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent2);pointer-events:none}
.float{position:absolute;width:27.78%;text-align:center;font:800 30px/1 var(--f-display);color:#fff;text-shadow:0 2px 10px rgb(0 0 0 / .9);pointer-events:none;z-index:5}


.wheel::after{content:"";position:absolute;top:-6px;bottom:-6px}
.wheel.wl::after{left:-88px;right:50%}
.wheel.wr::after{left:50%;right:-88px}
.wheel svg .mir{transform-box:view-box;transform-origin:0 0}
.w-axle rect{fill:#4b5163}.ax-hub{fill:#2a3040;stroke:#8a93aa;stroke-width:2}
.fl-sh{fill:#000;opacity:.16}
.fl-tyre{fill:#16181f}.fl-rim{fill:#cdd2dc}.fl-band{fill:none;stroke:var(--accent);stroke-width:3}
.fl-spk{stroke:#7b8294;stroke-width:2.6;stroke-linecap:round;fill:none}.fl-hub{fill:#7b8294}
.fl-hi{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.22}
.floor-glow{fill:url(#gGlow);opacity:0}
.wheel.active[data-s=loosen] .floor-glow{opacity:1;animation:glow 1s ease-in-out infinite}
.wheel[data-s=tighten] .floor-tyre,.wheel[data-s=done] .floor-tyre{opacity:0;transition:opacity .1s linear .26s}
.wheel[data-s=tighten] .fl-sh,.wheel[data-s=done] .fl-sh{opacity:0;transition:opacity .1s linear .26s}
.w-new{opacity:0;transform:scale(.78);transition:none}

<div id="app">
  <header id="top">
    <div id="brand">
      <!-- long-press the wordmark for 3s: hidden admin panel -->
      <div id="wordmark" class="wordmark">
        <!-- SPONSOR LOGO SLOT: set CONFIG.logoSVG to an approved SVG string, or paste the <svg> here. Empty = dashed placeholder. -->
        <span id="logoSlot" class="logo-slot" aria-hidden="true"></span>
        <span id="wmText" class="wm"></span>
      </div>
      <span id="concept" class="concept" data-i="concept"></span>
    </div>
    <div id="ctrl">
      <button id="btnMute" class="icon-btn pressable" type="button" aria-pressed="false"><span class="ring">
        <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </span></button>
      <button id="btnLang" class="icon-btn pressable" type="button"><span class="ring"><b id="langTxt"></b></span></button>
    </div>
  </header>

  <main id="screens">

    <!-- ============ START ============ -->
    <section id="sStart" class="screen active" aria-labelledby="ttl">
      <div class="hero">
        <div class="gantry" id="heroGantry" aria-hidden="true"></div>
        <div class="hero-wrap"><div class="hero-stage" id="heroStage" aria-hidden="true"></div></div>
      </div>
      <div class="copy">
        <h1 id="ttl" class="title outlined st" style="--i:1"><span id="t1"></span><span id="t2"></span></h1>
        <p id="eventLine" class="event st" style="--i:2"></p>
        <div class="name-box st" style="--i:3">
          <label class="sr" for="playerName" data-i="fName"></label>
          <input id="playerName" type="text" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="go">
          <p class="name-note" data-i="nameNote"></p>
          <p class="name-msg" id="nameMsg" role="alert"></p>
        </div>
        <button id="btnStart" class="cta idle pressable st" type="button" style="--i:3"><span class="face" data-i="start"></span></button>
        <p class="prize st" style="--i:4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="14" r="7.5"/><path d="M12 14v-4M9.5 2.5h5M12 6.5v-4"/></svg><span id="prizeTxt"></span></p>
      </div>
      <div class="top5 card st" style="--i:5">
        <h2 data-i="top5"></h2>
        <ol id="top5List" class="board"></ol>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="sGame" class="screen" data-phase="idle">
      <div id="hud">
        <div class="badge b-timer">
          <span class="b-label" data-i="hTime"></span>
          <div id="timer" class="ltr" dir="ltr" aria-hidden="true"><span id="tVal">0.000</span><small class="unit"></small></div>
          <div id="pen" class="b-pen" aria-hidden="true"><span class="b-label" data-i="penLabel"></span><span id="penTxt" class="num ltr"></span></div>
        </div>
        <div class="hud-right">
          <div class="badge b-wheels"><span class="b-label" data-i="hWheels"></span><div class="pips" id="pips" aria-hidden="true"></div></div>
        </div>
      </div>
      <div id="stageWrap">
        <div id="stage">
          <div id="camera"></div>
          <div id="streaks"></div>
          <div id="cd" class="cd" aria-hidden="true"></div>
          <div id="banner" class="banner" aria-hidden="true"><b>!</b><span id="bannerTxt"></span></div>
          <div id="flash"></div>
        </div>
      </div>
      <div id="foot">
        <div id="gantry" class="gantry stage-gantry" aria-hidden="true"></div>
        <p id="prompt" class="prompt" aria-hidden="true"></p>
        <button id="btnGo" class="go" type="button"><span class="go-main" id="goMain"></span><span class="go-sub" id="goSub"></span></button>
      </div>
    </section>

    <!-- ============ RESULT ============ -->
    <section id="sResult" class="screen" aria-labelledby="rTitle">
      <div class="res-scroll" id="resScroll">
        <div class="res-left">
          <h2 id="rTitle" class="outlined st" style="--i:0" tabindex="-1" data-i="rTitle"></h2>
          <div class="res-time badge ltr st" dir="ltr" style="--i:1"><span id="rTime" class="num">0.000</span><small class="unit"></small></div>
          <p id="rRank" class="res-rank st" style="--i:2"></p>
          <div id="tier" class="tier" data-tier="driver">
            <div class="tier-icon" id="tierIcon"></div>
            <div><strong id="tierName"></strong><span class="tag" id="tierTag"></span></div>
          </div>
          <dl class="breakdown st" style="--i:3">
            <div><dt data-i="bService"></dt><dd class="ltr" id="bSv"></dd></div>
            <div><dt data-i="bReact"></dt><dd class="ltr" id="bRe"></dd></div>
            <div><dt data-i="bPen"></dt><dd class="ltr" id="bPe"></dd></div>
          </dl>
        </div>
        <div class="res-right st" style="--i:4">
          <div id="board" class="card board-card">
            <h3 data-i="boardTitle"></h3>
            <ol id="boardList" class="board"></ol>
            <button id="btnAgain" type="button" class="cta pressable"><span class="face" data-i="again"></span></button>
            <button id="btnNext" type="button" class="ghost pressable" data-i="next"></button>
          </div>
        </div>
      </div>
      <p id="resetNote" class="reset-note" aria-hidden="true"></p>
    </section>
  </main>
</div>

<!-- hidden admin -->
<div id="admin" class="overlay" aria-hidden="true">
  <div class="card adm" role="dialog" aria-modal="true" aria-labelledby="admTitle">
    <h2 id="admTitle" data-i="admTitle"></h2>
    <p id="admStats"></p>
    <button id="admScores" class="btn pressable" type="button" data-i="admScores"></button>
    <button id="admClear" class="btn warn pressable" type="button" data-i="admClear"></button>
    <button id="admClose" class="ghost pressable" type="button" data-i="admClose"></button>
    <p id="admMsg" aria-live="polite"></p>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
const E_OUT = 'cubic-bezier(.22,1,.36,1)', E_SPRING = 'cubic-bezier(.34,1.56,.64,1)', E_IN = 'cubic-bezier(.55,0,.9,.4)';

let lang = CONFIG.defaultLang === 'ar' ? 'ar' : 'en';
const loc = v => (v && typeof v === 'object') ? (v[lang] || v.en || '') : (v || '');
const t = (k, v) => {
  let s = (I18N[lang] && I18N[lang][k]);
  if (s == null) s = I18N.en[k];
  if (s == null) s = k;
  return v ? s.replace(/\{(\w+)\}/g, (m, n) => (v[n] != null ? v[n] : m)) : s;
};
const sponsor = () => (lang === 'ar' && CONFIG.sponsorNameAr) ? CONFIG.sponsorNameAr : CONFIG.sponsorName;
const fmt = ms => (Math.max(0, ms) / 1000).toFixed(3);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const firstName = n => String(n || '').trim().split(/\s+/)[0].slice(0, 18);
const cleanName = raw => { const n = firstName(raw); return n.length >= 2 ? n : ''; };
const tierOf = ms => { const s = ms / 1000; return s <= CONFIG.tiers.champion ? 'champion' : s <= CONFIG.tiers.racer ? 'racer' : 'driver'; };
const cancelAnims = el => { if (el && el.getAnimations) el.getAnimations().forEach(a => a.cancel()); };
const wc = (el, on) => { if (el) el.style.willChange = on ? 'transform' : ''; };
const vib = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const evTime = e => { const x = e && e.timeStamp; return (x > 0 && x < 1e11) ? x : performance.now(); };

function anim(el, frames, opts) {
  if (!el || !el.animate) return null;
  if (RM.matches) opts = Object.assign({}, opts, { duration: 1, delay: 0 });
  try { return el.animate(frames, opts); } catch (e) { return null; }
}

/* timers without setTimeout: tasks are checked against performance.now() inside the rAF loop */
const Q = [];
const later = (ms, fn) => Q.push({ t: performance.now() + ms, fn });
function runQ(now) {
  for (let i = 0; i < Q.length;) {
    if (Q[i].t <= now) { const f = Q[i].fn; Q.splice(i, 1); try { f(); } catch (e) { console.error(e); } }
    else i++;
  }
}

function applyTheme() {
  const h2r = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  try {
    const a = h2r(CONFIG.accent), b = h2r(CONFIG.accent2), cr = CONFIG.cream || '#FFF5E4', c = h2r(cr);
    const d = CONFIG.deep ? h2r(CONFIG.deep) : a.map(v => Math.round(v * .26));

    r.setProperty('--accent-rgb', a.join(' ')); r.setProperty('--accent2-rgb', b.join(' '));
    r.setProperty('--accent-d', 'rgb(' + a.map(v => Math.round(v * .62)).join(',') + ')');
    r.setProperty('--deep', 'rgb(' + d.join(',') + ')'); r.setProperty('--deep-rgb', d.join(' '));
    r.setProperty('--cream', cr); r.setProperty('--cream-rgb', c.join(' '));

/* =====================================================================
   AUDIO (Web Audio synth) + HAPTICS
   ===================================================================== */
const SFX = (() => {
  let ctx = null, master = null, nbuf = null, muted = false;
  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
    master = ctx.createGain(); master.gain.value = muted ? 0 : .85; master.connect(ctx.destination);
    nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function unlock() { const c = ensure(); if (c && c.state !== 'running' && c.resume) { try { c.resume().catch(() => {}); } catch (e) {} } }
  function tone(f, d, o) {
    if (muted) return; const c = ensure(); if (!c) return; o = o || {};
    const t0 = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(o.v || .2, t0 + (o.a || .004)); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + d + .03);
  }
  function noise(d, o) {
    if (muted) return; const c = ensure(); if (!c) return; o = o || {};
    const t0 = c.currentTime + (o.at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = nbuf; f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0 || 800, t0); f.frequency.exponentialRampToValueAtTime(o.f1 || 2400, t0 + d);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(o.v || .15, t0 + (o.a || .01)); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d + .03);
  }
  return {
    unlock,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : .85; },
    tick()    { tone(1800, .035, { type: 'square', v: .05 }); },
    whoosh()  { noise(.7, { f0: 250, f1: 3400, q: .8, v: .24, a: .08 }); tone(90, .6, { type: 'sawtooth', to: 260, v: .05, a: .1 }); },
    beep(i)   { tone(520 + i * 40, .13, { v: .24 }); },
    go()      { tone(880, .3, { v: .26 }); tone(1320, .3, { v: .1, at: .02 }); },
    light()   { tone(680, .09, { type: 'square', v: .07 }); },
    loosen()  { noise(.09, { f0: 2600, f1: 900, q: 3, v: .2 }); noise(.09, { f0: 2400, f1: 800, q: 3, v: .18, at: .06 }); tone(320, .06, { type: 'triangle', v: .08 }); },
    tighten() { tone(250, .09, { type: 'triangle', v: .26, to: 150 }); noise(.05, { f0: 3000, f1: 1200, q: 2, v: .12 }); },
    wheelDone() { tone(880, .1, { v: .16 }); tone(1175, .16, { v: .16, at: .07 }); },
    buzz()    { tone(120, .24, { type: 'sawtooth', to: 80, v: .17 }); noise(.2, { type: 'lowpass', f0: 500, f1: 200, v: .1 }); },
    good(ms)  { const n = [440, 554, 659, 880]; const k = ms < 350 ? 4 : 3; for (let i = 0; i < k; i++) tone(n[i], .16 + i * .02, { v: .2, at: i * .09 }); },
    sweep()   { tone(300, 1.2, { to: 1300, v: .06, a: .06 }); },
    tier(x)   { const seq = x === 'champion' ? [523, 659, 784, 1047] : x === 'racer' ? [523, 784] : [523]; seq.forEach((f, i) => tone(f, .34, { v: .18, at: i * .1 })); }
  };
})();

  const a = anim(carWrap, [

    { transform: 'translateY(-3.2%)', offset: .72, easing: 'cubic-bezier(.4,0,.2,1)' },
    { transform: 'translateY(0)' }], { duration: dur, fill: 'forwards' });
  const done = () => { carWrap.style.transform = 'none'; if (a) a.cancel(); wc(carWrap, false); };
  if (a) a.onfinish = done; else done();
  anim(camera, [{ transform: 'scale(1.07) translateY(10px)' }, { transform: 'scale(1) translateY(0)' }], { duration: RM.matches ? 1 : 800, delay: RM.matches ? 0 : dur * .62, easing: E_OUT, fill: 'both' });

}

  cdEl.textContent = txt; cdEl.className = 'cd show' + (i === 3 ? ' cdgo' : '');
  anim(cdEl, [{ transform: 'scale(1.55)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: .35 }, { transform: 'scale(1)', opacity: 1 }], { duration: i === 3 ? 450 : 650, easing: E_SPRING });
  if (i === 3) { SFX.go(); vib(18); anim(flashEl, [{ opacity: 0 }, { opacity: .7, offset: .15 }, { opacity: 0 }], { duration: 420 }); later(520, () => { cdEl.className = 'cd'; }); } else { SFX.beep(i); vib(8); }
}

/* ---- b. SERVICE ---- */
function startService() {
  setPhase('service'); G.tService = performance.now(); G.idx = 0;
  G.order = [0, 1, 2, 3]; for (let k = 3; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [G.order[k], G.order[j]] = [G.order[j], G.order[k]]; }
  activateWheel(G.order[0]);
  G.raise = anim(carWrap, [{ transform: 'none' }, { transform: 'scale(1.045)' }], { duration: 260, easing: E_OUT, fill: 'forwards' });
}
function activateWheel(i) {
  const w = stageWheels[i]; w.dataset.s = 'loosen'; w.classList.add('active'); setPips(G.idx); setPrompt('pLoosen');
  say(t('sayWheel', { n: G.idx + 1 }) + ' ' + t('pLoosen'));
}
/* whole-stage kick so each wheel finishing lands with weight; the 4th is bigger */
function punch(k) {
  if (RM.matches) return;
  anim(camera, [{ transform: 'scale(1)' }, { transform: 'scale(' + k + ')', offset: .22 }, { transform: 'scale(1)' }], { duration: 380, easing: E_OUT });
}
function ripple(el) {
  const r = document.createElement('span'); r.className = 'ripple'; el.appendChild(r);
  const a = anim(r, [{ transform: 'scale(.4)', opacity: .8 }, { transform: 'scale(1.5)', opacity: 0 }], { duration: 480, easing: E_OUT });
  if (a) a.onfinish = () => r.remove(); else r.remove();
}
function pop(el) { anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(.9)', offset: .3 }, { transform: 'scale(1.06)', offset: .65 }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' }); }
function floatText(txt, el) {
  const s = document.createElement('span'); s.className = 'float'; s.textContent = txt;
  s.style.left = el ? el.style.left : '36%'; s.style.top = el ? el.style.top : '40%';
  $('#stage').appendChild(s);
  const a = anim(s, [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-44px)', opacity: 0 }], { duration: 750, easing: E_OUT });
  if (a) a.onfinish = () => s.remove(); else s.remove();
}
function banner(txt, ms) {
  bannerTxt.textContent = txt;
  anim(bannerEl, [{ opacity: 0, transform: 'translateY(10px) scale(.96)' }, { opacity: 1, transform: 'none', offset: .1 }, { opacity: 1, transform: 'none', offset: .82 }, { opacity: 0, transform: 'translateY(-6px)' }],
    { duration: ms || 1400, easing: 'ease-out' });
}
function penalty(ms, el) {
  G.penMs += ms; setPenChip(); SFX.buzz(); vib([30, 40, 30]);
  if (el && !RM.matches) anim(el, [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)', offset: .2 }, { transform: 'translateX(8px)', offset: .45 }, { transform: 'translateX(-5px)', offset: .7 }, { transform: 'translateX(0)' }], { duration: 320, easing: 'ease-out' });
  anim(flashEl, [{ opacity: 0 }, { opacity: .8, offset: .2 }, { opacity: 0 }], { duration: 360 });
  anim(penEl, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)', offset: .35 }, { transform: 'scale(1)' }], { duration: 340, easing: E_SPRING });
  if (el) floatText('+' + (ms / 1000).toFixed(1), el);
  if (G.state === 'service') setTimer(performance.now() - G.tService + G.penMs);
  else if (G.state === 'launch' && !G.lightsOut) setTimer(G.serviceMs + G.penMs);
}

function wheelDown(e) {
  if (G.state !== 'service') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const w = e.target.closest && e.target.closest('.wheel'); if (!w) return;
  const i = +w.dataset.w, now = performance.now();
  if (i !== G.order[G.idx]) {
    if (w.dataset.s === 'done' && now - G.lastAdv < 170) return;   // ignore finger bounce on a wheel just finished
    penalty(CONFIG.penalties.wrongTap * 1000, w); return;
  }
  pop(w); ripple(w); G.lastAdv = now;
  if (w.dataset.s === 'loosen') {
    w.dataset.s = 'tighten'; SFX.loosen(); vib(12); setPrompt('pTighten'); say(t('pTighten'));
  } else {
    w.dataset.s = 'done'; w.classList.remove('active'); SFX.tighten(); SFX.wheelDone(); vib([10, 24, 16]);
    punch(G.idx === 3 ? 1.035 : 1.014);
    G.idx++;
    if (G.idx < 4) activateWheel(G.order[G.idx]); else { setPips(4); finishService(); }
  }
}

/* ---- c. LAUNCH ---- */
function finishService() {
  G.serviceMs = performance.now() - G.tService;
  setPhase('launch'); setPrompt(''); say(t('sayLaunch'));
  if (G.raise) G.raise.cancel();
  anim(carWrap, [{ transform: 'scale(1.045)' }, { transform: 'scale(.98)', offset: .55 }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' }); vib(24);
  setTimer(G.serviceMs + G.penMs);
  gantry.classList.add('in'); SFX.whoosh();
  const now = performance.now(), L = CONFIG.launch;
  G.lampTimes = [0, 1, 2, 3, 4].map(i => now + 600 + i * L.lampIntervalMs);
  G.lightsOutAt = G.lampTimes[4] + L.minDelayMs + Math.random() * (L.maxDelayMs - L.minDelayMs);
  G.lampIdx = 0; goSub.textContent = t('goWait');
}
function lampOn(i) { lamps[i].classList.add('on'); SFX.light(); vib(6); }
function doLightsOut() {
  G.lightsOut = true; G.t0 = performance.now();
  gantry.classList.add('instant'); lamps.forEach(l => l.classList.remove('on'));
  goBtn.classList.add('live'); goSub.textContent = t('goNow'); say(t('goNow'));
  anim(goBtn, [{ transform: 'scale(.96)' }, { transform: 'scale(1.03)', offset: .5 }, { transform: 'scale(1)' }], { duration: 260, easing: E_SPRING });
}
function goDown(e) {
  if (G.state !== 'launch' || G.finished) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const tt = evTime(e);
  if (!G.lightsOut || tt < G.t0) {                         // early tap = false start
    if (G.falseStart) return;
    G.falseStart = true; penalty(CONFIG.penalties.falseStart * 1000, null);
    banner(t('bFalse', { s: CONFIG.penalties.falseStart.toFixed(1) }), 1500); say(t('bFalse', { s: CONFIG.penalties.falseStart.toFixed(1) })); return;
  }
  G.finished = true; G.reactionMs = Math.max(1, tt - G.t0);
  G.totalMs = G.serviceMs + G.reactionMs + G.penMs;
  setPhase('done'); setTimer(G.totalMs); timerEl.classList.add('final');
  SFX.good(G.reactionMs); vib([20, 30, 60]);
  banner(t('bReaction', { s: fmt(G.reactionMs) }), 1300); say(t('bReaction', { s: fmt(G.reactionMs) }));
  wc(carWrap, true); wc(streaks, true);
  anim(carWrap, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(3%) scale(.99)', offset: .14 }, { transform: 'translateY(-150%) scale(1.04)' }], { duration: RM.matches ? 1 : 1050, delay: 60, easing: 'cubic-bezier(.5,0,.85,.3)', fill: 'forwards' });
  anim(streaks, [{ opacity: 0, transform: 'translateY(-12%)' }, { opacity: .9, transform: 'translateY(2%)', offset: .35 }, { opacity: 0, transform: 'translateY(14%)' }], { duration: 800, delay: 120, easing: 'linear' });
  if (!RM.matches) anim(camera, [{ transform: 'scale(1)' }, { transform: 'scale(1.07)' }], { duration: 1100, delay: 60, easing: E_IN });
  later(220, () => SFX.whoosh());
  recordRound(false); later(1700, showResult);
}
function timeUp() {
  if (G.finished) return; G.finished = true; G.dnf = true;
  if (G.state === 'service') G.serviceMs = performance.now() - G.tService;
  setPhase('done'); SFX.buzz(); vib([60, 40, 60]); banner(t('bTimeUp'), 1200); say(t('bTimeUp'));
  recordRound(true); later(1300, showResult);
}
function recordRound(dnf) {
  const r = { id: uid(), ts: Date.now(), day: dayKey(), dnf, serviceMs: G.serviceMs, reactionMs: dnf ? null : G.reactionMs, penMs: G.penMs,
    timeMs: dnf ? null : G.totalMs, tier: dnf ? 'driver' : tierOf(G.totalMs), lang, name: playerName };
  if (!dnf) { DB.scores.push({ id: r.id, ts: r.ts, day: r.day, name: r.name, timeMs: r.timeMs, tier: r.tier }); if (DB.scores.length > 3000) DB.scores.shift(); saveDB(); }
  session.rounds.push(r); if (session.rounds.length > 3000) session.rounds.shift(); lastRound = r;
}

/* =====================================================================
   RESULT
   ===================================================================== */
let countAnim = null, lastAct = performance.now(), adminOpen = false;
const rTime = () => $('#rTime');

function renderResultTexts() {
  const r = lastRound; if (!r) return;
  tierEl.dataset.tier = r.tier;
  $('#tierIcon').innerHTML = chev(r.tier === 'champion' ? 3 : r.tier === 'racer' ? 2 : 1);
  $('#tierName').textContent = t('tier_' + r.tier); $('#tierTag').textContent = t('tag_' + r.tier);
  if (r.dnf) $('#rRank').textContent = t('dnfNote');
  else { const l = todayBoard(), pos = l.findIndex(s => s.id === r.id) + 1; $('#rRank').textContent = t('rankLine', { n: pos, m: l.length }); }
  const u = ' ' + t('unit');
  $('#bSv').textContent = r.dnf ? '--' : fmt(r.serviceMs) + u;
  $('#bRe').textContent = r.dnf ? '--' : fmt(r.reactionMs) + u;
  $('#bPe').textContent = '+' + (r.penMs / 1000).toFixed(1) + u;
}
function showResult() {
  show('result'); lastAct = performance.now(); resScroll.scrollTop = 0;
  tierEl.classList.remove('show'); renderResultTexts();
  renderBoard($('#boardList'), CONFIG.leaderboardSize, lastRound && !lastRound.dnf ? lastRound.id : null);
  const r = lastRound; rTime().textContent = r.dnf ? '--.---' : '0.000';
  const h = $('#rTitle'); if (h && h.focus) h.focus({ preventScroll: true });
  later(480, () => {
    if (r.dnf || RM.matches) { if (!r.dnf) rTime().textContent = fmt(r.timeMs); revealTier(); }
    else { countAnim = { t0: performance.now(), dur: 1400, to: r.timeMs }; SFX.sweep(); }
  });
}
function revealTier() { tierEl.classList.add('show'); SFX.tier(lastRound.tier); vib(lastRound.tier === 'champion' ? [20, 40, 20, 40, 70] : [18]); }


function goStart() {
  Q.length = 0; countAnim = null; playerName = ''; $('#playerName').value = ''; G = newG(); G.state = 'start';
  show('start'); renderBoard($('#top5List'), CONFIG.leaderboardSize, null);
  resetNote.classList.remove('on'); adminOpen && closeAdmin();
}

/* lead form */
function bindResult() {
  onTap($('#btnAgain'), () => { SFX.tick(); startRound(); });
  onTap($('#btnNext'), () => { SFX.tick(); goStart(); });
}

/* =====================================================================
   ADMIN  (long-press wordmark 3s)
   ===================================================================== */
const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const stamp = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); };
function download(name, text) {
  const url = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function adminStats() { $('#admStats').textContent = t('admStats', { s: allScores().length }); }
function openAdmin() {
  adminOpen = true; adminEl.classList.add('open'); adminEl.setAttribute('aria-hidden', 'false'); adminStats(); $('#admMsg').textContent = '';
  vib([30, 40, 30]); setTimeout(() => $('#admClose').focus(), 50);
}
function closeAdmin() { adminOpen = false; adminEl.classList.remove('open'); adminEl.setAttribute('aria-hidden', 'true'); clearConfirm(); }
let confirmUntil = 0;
function clearConfirm() { confirmUntil = 0; $('#admClear').textContent = t('admClear'); }
function bindAdmin() {
  let hold = null; const wm = $('#wordmark'), stop = () => { clearTimeout(hold); hold = null; };
  wm.addEventListener('pointerdown', () => { if (cur !== 'start' && cur !== 'result') return; stop(); hold = setTimeout(openAdmin, CONFIG.adminHoldMs); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => wm.addEventListener(ev, stop));
  onTap($('#admClose'), closeAdmin);
  onTap($('#admScores'), () => {
    const list = allScores(); if (!list.length) { $('#admMsg').textContent = t('admNone'); return; }
    const head = ['id', 'timestamp', 'date', 'time_s', 'tier', 'first_name', 'consented', 'dnf'];
    download('pitstop-scores-' + stamp() + '.csv', toCSV([head].concat(list.map(s => [s.id, new Date(s.ts).toISOString(), s.day, s.timeMs == null ? '' : (s.timeMs / 1000).toFixed(3), s.tier, s.name || '', s.consented ? 'yes' : 'no', s.dnf ? 'yes' : 'no']))));
  });
  onTap($('#admClear'), () => {
    const now = performance.now();
    if (now > confirmUntil) { confirmUntil = now + 3500; $('#admClear').textContent = t('admConfirm'); return; }
    DB = { v: 1, leads: [], scores: [] }; session.rounds = []; try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    clearConfirm(); adminStats(); $('#admMsg').textContent = t('admCleared'); renderBoard($('#top5List'), CONFIG.leaderboardSize, null);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && adminOpen) closeAdmin(); });
}

/* =====================================================================
   INPUT HELPERS
   ===================================================================== */
/* pointerdown for instant response; click only handles keyboard / assistive activation (detail === 0) */
function onTap(el, fn) {
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; fn(e); });
  el.addEventListener('click', e => { if (e.detail === 0) fn(e); });
}
let pressedEl = null;
function bindPress() {
  document.addEventListener('pointerdown', e => { const p = e.target.closest && e.target.closest('.pressable, .go'); if (p) { p.classList.add('pressed'); pressedEl = p; } }, { passive: true });
  const rel = () => { if (pressedEl) { pressedEl.classList.remove('pressed'); pressedEl = null; } $$('.pressed').forEach(p => p.classList.remove('pressed')); };
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, rel, { passive: true }));
  addEventListener('blur', rel);
  ['pointerdown', 'keydown', 'input', 'scroll', 'wheel'].forEach(ev => document.addEventListener(ev, () => { lastAct = performance.now(); }, { capture: true, passive: true }));
  document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input'))) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && cur === 'game') goStart(); });
}

/* =====================================================================
   MAIN LOOP  (requestAnimationFrame + performance.now)
   ===================================================================== */
function frame() {
  const now = performance.now();
  runQ(now);
  if (cur === 'game') gameTick(now);
  else if (cur === 'start') idleTick(now);
  else if (cur === 'result') resultTick(now);
  requestAnimationFrame(frame);
}
function gameTick(now) {
  if (G.finished) return;
  if (G.state === 'service') {
    const el = now - G.tService;
    if (el > CONFIG.roundSeconds * 1000) { timeUp(); return; }
    setTimer(el + G.penMs);
  } else if (G.state === 'launch') {
    if (!G.lightsOut) {
      while (G.lampIdx < 5 && now >= G.lampTimes[G.lampIdx]) lampOn(G.lampIdx++);
      if (G.lampIdx === 5 && now >= G.lightsOutAt) doLightsOut();
    } else {
      if (now > G.t0 + CONFIG.launchTimeoutMs) { timeUp(); return; }
      setTimer(G.serviceMs + G.penMs + (now - G.t0));
    }
  }
}
function idleTick(now) {
  const nameIn = $('#playerName');
  if (nameIn.value && now - nameAct > CONFIG.kioskResetSeconds * 1000) { nameIn.value = ''; playerName = ''; }
  const ph = now % 7000;
  heroLamps.forEach((l, i) => { const on = ph > 700 + i * 420 && ph < 4700; if (on !== l._on) { l._on = on; l.classList.toggle('on', on); } });
}
function resultTick(now) {
  if (countAnim) {
    const p = Math.min(1, (now - countAnim.t0) / countAnim.dur), e = 1 - Math.pow(1 - p, 4);
    rTime().textContent = fmt(countAnim.to * e);
    if (p >= 1) { rTime().textContent = fmt(countAnim.to); countAnim = null; revealTier(); }
  }
  if (adminOpen) { lastAct = now; return; }
  const left = CONFIG.kioskResetSeconds * 1000 - (now - lastAct);
  if (left <= 0) { goStart(); return; }
  if (left < 10000) { const m = t('resetIn', { s: Math.ceil(left / 1000) }); if (m !== resetNote.textContent) resetNote.textContent = m; resetNote.classList.add('on'); }
  else if (resetNote.classList.contains('on')) resetNote.classList.remove('on');
}

/* =====================================================================
   INIT
   ===================================================================== */
function init() {
  applyTheme(); build();
  const nameIn = $('#playerName'), nameMsg = $('#nameMsg');
  const begin = () => {
    const n = cleanName(nameIn.value);
    if (!n) { nameMsg.dataset.k = 'errName'; nameMsg.textContent = t('errName'); nameIn.setAttribute('aria-invalid', 'true'); nameIn.focus(); SFX.buzz(); vib([30, 40, 30]); return; }
    delete nameMsg.dataset.k; nameMsg.textContent = ''; nameIn.removeAttribute('aria-invalid');
    playerName = n; nameIn.blur(); SFX.unlock(); startRound();
  };
  onTap($('#btnStart'), begin);
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); begin(); } });
  nameIn.addEventListener('input', () => { nameAct = performance.now(); if (nameMsg.textContent) { delete nameMsg.dataset.k; nameMsg.textContent = ''; nameIn.removeAttribute('aria-invalid'); } });
  onTap(btnMute, () => { muted = !muted; SFX.setMuted(muted); setMuteUI(); SFX.tick(); vib(8); });
  onTap(btnLang, () => { lang = lang === 'en' ? 'ar' : 'en'; applyLang(); SFX.tick(); vib(8); });
  carWrap.addEventListener('pointerdown', wheelDown);
  carWrap.addEventListener('click', e => { if (e.detail === 0) wheelDown(e); });
  goBtn.addEventListener('pointerdown', goDown);
  goBtn.addEventListener('click', e => { if (e.detail === 0) goDown(e); });
  bindResult(); bindAdmin(); bindPress();
  G.state = 'start';
  applyLang(); show('start');
  requestAnimationFrame(frame);
}
init();
})();
</script>
</body>
